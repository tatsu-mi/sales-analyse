# config.toml にコピーして使用してください。このサンプルに実際の認証情報を書かないでください。
# IMAP接続先・認証情報、APIキー、Teams URLは .env.example を参考に .env へ設定します。
[logging]
# 出力する最低ログレベル。DEBUG / INFO / WARNING / ERROR / CRITICAL
# INFO: 進捗・完了、DEBUG: IMAP接続情報やメール単位の処理も出力します。
level = "INFO"

[imap]
port = 993
folder = "INBOX"
# IMAP接続・通信のタイムアウト（秒）。
timeout_seconds = 60

[gemini]
# スキルシートPDF解析だけ別モデルを使う場合に指定（省略時はmodel）。
# skill_sheets_model = "利用可能なGeminiモデルID"
model = "gemini-3.5-flash-lite"
# API通信のタイムアウト（秒）と、1回の応答に使用する最大出力トークン数。
timeout_seconds = 180
max_output_tokens = 16384
# 初回呼び出しに加えて再試行する回数。1以上で指定します。
retries = 5
# HTTP 429/5xxの再試行待ち時間。Google指定の待ち時間があればそちらを優先します。
retry_base_seconds = 15
retry_max_wait_seconds = 120
# ローカルで制御する送信量。Google側の実際の割当量以下に設定してください。
# TPMはこの値の80%を使用。ほかのアプリによる同じプロジェクトの消費は含みません。
requests_per_minute = 5
input_tokens_per_minute = 150000

[analysis]
# エンジニア一覧のMarkdownファイル。相対パスはこの設定ファイルの場所が基準。
engineers_file = "engineers.md"
# 期間指定なしは前回正常完了の実施時刻以降。記録のない初回のみ直近24時間。
lookback_hours = 24
# 判定条件は別ファイルで管理。相対パスはこの設定ファイルの場所が基準。
priority_rules_file = "priority_rules.example.md"
# --start / --end を両方指定すると、指定日付の全日を対象にします。
# start_date = "2026-10-01"
# end_date = "2026-10-15"
# 新しいメールから取得する件数の上限。達したら取得を終えて分析に進みます。
max_emails = 2000
# 1件の本文の文字数上限。超えた分は省略し、記録に明示します。
max_body_chars = 8000
# 添付を含むメール全体のサイズ上限（バイト）。超えたメールは警告を記録してスキップします。
max_message_bytes = 10000000
# 相対パスは config.toml の場所が基準です。実行ごとにサブフォルダを作成します。
output_dir = "output"
# 件数ではなく、指示文・スキーマを含めた実測トークンでファイルを分割します。
chunk_input_tokens = 30000
report_input_tokens = 60000
summary_output_tokens = 6000
# 個人別ランキングの要件ごとの配点（正の整数）。実務以外はこの得点の0.1倍。
matching_mandatory_weight = 10
matching_welcome_weight = 5
matching_related_weight = 2
# 案件抽出と最終レポートの分析観点。
instructions = """
メールからSES要員募集を抽出し、priority_rules_fileの条件で判定します。
engineers.mdのエンジニアごとに適合確認済みを優先し、要確認も含めて合計で上位10通までをメール単位で抽出します。AIによる原文引用の生成や市況メモは不要です。
"""
