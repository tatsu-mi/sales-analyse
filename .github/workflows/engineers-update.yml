name: Update engineers from skill sheets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'append: 未登録資料を追記 / overwrite: 全PDFから再生成'
        required: true
        default: append
        type: choice
        options:
          - append
          - overwrite

permissions:
  contents: read
  id-token: write

concurrency:
  group: mail-report
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Authenticate to Microsoft 365
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Analyse PDFs and update engineers.md
        env:
          UPDATE_MODE: ${{ inputs.mode }}
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          # Do not expose private PDF names or API diagnostics in Actions logs.
          if ! python -m sales_analyze.skill_sheets --mode "$UPDATE_MODE" > "$RUNNER_TEMP/engineers-update.log" 2>&1; then
            python - <<'PY'
          import os
          from pathlib import Path
          from sales_analyze.sharepoint_run import Store, save_failure
          try:
              save_failure(Store(), 'engineers-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'],
                           RuntimeError('Skill sheet update failed'), Path(os.environ['RUNNER_TEMP']) / 'engineers-update.log')
          except Exception:
              print('::error::Could not save private diagnostics to SharePoint.')
          PY
            echo "::error::Engineer update failed. Check temporary-runs/engineers-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/ in SharePoint."
            exit 1
          fi
          echo "Engineer update completed."
