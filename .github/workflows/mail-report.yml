name: Mail analysis and Teams report

on:
  schedule:
    # Monday-Friday 07:00 JST (Sunday-Thursday 22:00 UTC).
    - cron: '0 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mail-report
  cancel-in-progress: false

jobs:
  calendar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.calendar.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Japanese business day
        id: calendar
        run: python check_business_day.py

  report:
    # Keep one checkpoint stream on the default branch, including manual runs.
    needs: calendar
    if: needs.calendar.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests without external services
        run: python -m unittest discover -s tests -q

      - name: Validate TOML without credentials
        run: python validate_config.py

      - name: Validate SharePoint settings
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID SHAREPOINT_DRIVE_ID SHAREPOINT_FOLDER_ID; do
            if [ -z "${!name//[[:space:]]/}" ]; then
              echo "::error::Missing setting: $name"
              exit 1
            fi
          done

      - name: Restore checkpoint from the last successful run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          successful_runs=$(gh api --method GET --paginate "repos/$GH_REPO/actions/workflows/mail-report.yml/runs" \
            -f branch="$DEFAULT_BRANCH" -f status=success -f per_page=100 \
            --jq '.workflow_runs[].id')
          previous_run=''
          for candidate in $successful_runs; do
            # Calendar-only success has no delivered checkpoint. Ignore those runs.
            skipped=$(gh api --method GET "repos/$GH_REPO/actions/runs/$candidate/jobs" \
              -f per_page=100 --jq 'any(.jobs[]; .name == "report" and .conclusion == "skipped")')
            if [ "$skipped" = true ]; then
              continue
            fi
            previous_run="$candidate"
            break
          done
          if [ -n "$previous_run" ]; then
            # Missing/expired artifacts must fail rather than silently skip old mail.
            gh run download "$previous_run" --name mail-checkpoint --dir .gha-state
            test -f .gha-state/checkpoint.json
          else
            echo 'First successful delivery: use analysis.lookback_hours from TOML.'
          fi

      - name: Authenticate to Microsoft 365
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download engineer profiles from SharePoint
        env:
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Always download a fresh copy. Do not print profiles or Graph errors.
          rm -f engineers.md
          if ! az rest --method GET \
            --url "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${FOLDER_ID}:/engineers.md:/content" \
            --resource "https://graph.microsoft.com/" \
            --output-file "$RUNNER_TEMP/engineers.md" \
            --output none > "$RUNNER_TEMP/engineers-download.log" 2>&1; then
            echo '::error::Could not download engineers.md from the report folder in SharePoint.'
            exit 1
          fi
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import engineer_matching
          import mail_analyzer

          source = Path(os.environ['RUNNER_TEMP']) / 'engineers.md'
          try:
              engineer_matching.load_profiles(source)
              config = mail_analyzer.load_config(Path('config.toml'), load_environment=False)
              destination = Path(config['analysis']['engineers_file'])
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
          except (OSError, ValueError, mail_analyzer.ToolError):
              raise SystemExit('engineers.mdの取得・UTF-8形式・プロフィールの見出しを確認してください。') from None
          PY

      - name: Analyze and prepare report
        env:
          SAKURA_MAIL_HOST: ${{ secrets.SAKURA_MAIL_HOST }}
          SAKURA_MAIL_USERNAME: ${{ secrets.SAKURA_MAIL_USERNAME }}
          SAKURA_MAIL_PASSWORD: ${{ secrets.SAKURA_MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        shell: bash
        run: |
          # Analysis output can contain names, project details and API responses.
          # Keep it on the runner; never publish it as a log or artifact.
          if ! python scheduled_run.py --config config.toml --prepare-only > "$RUNNER_TEMP/mail-analysis.log" 2>&1; then
            echo '::error::Report preparation failed. Check configuration and external service availability.'
            exit 1
          fi

      - name: Upload report to SharePoint
        id: sharepoint-report
        env:
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s .gha-report/report.md
          filename="report-$(TZ=Asia/Tokyo date +%Y%m%d%H%M).md"
          report_url=$(az rest \
            --method PUT \
            --url "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${FOLDER_ID}:/${filename}:/content" \
            --resource "https://graph.microsoft.com/" \
            --headers "Content-Type=text/plain; charset=utf-8" \
            --body "@.gha-report/report.md" \
            --query webUrl \
            --output tsv)
          REPORT_URL="$report_url" python -c 'import os; from scheduled_run import validate_report_url; validate_report_url(os.environ["REPORT_URL"])'
          printf 'report-url=%s\n' "$report_url" >> "$GITHUB_OUTPUT"

      - name: Send SharePoint link to Teams and commit checkpoint
        env:
          SAKURA_MAIL_HOST: ${{ secrets.SAKURA_MAIL_HOST }}
          SAKURA_MAIL_USERNAME: ${{ secrets.SAKURA_MAIL_USERNAME }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPORT_URL: ${{ steps.sharepoint-report.outputs.report-url }}
        run: python scheduled_run.py --config config.toml --notify-only --link-only

      - name: Save delivered checkpoint
        uses: actions/upload-artifact@v7
        with:
          name: mail-checkpoint
          path: .gha-state/checkpoint.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
