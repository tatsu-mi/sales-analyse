name: Mail analysis and Teams report

on:
  schedule:
    # Monday-Friday 05:00 JST (Sunday-Thursday 20:00 UTC).
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-report
  cancel-in-progress: false

jobs:
  calendar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.calendar.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Japanese business day
        id: calendar
        run: python check_business_day.py

  report:
    # Keep one checkpoint stream on the default branch, including manual runs.
    needs: calendar
    if: needs.calendar.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate SharePoint settings
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SHAREPOINT_DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID SHAREPOINT_DRIVE_ID SHAREPOINT_FOLDER_ID; do
            if [ -z "${!name//[[:space:]]/}" ]; then
              echo "::error::Missing setting: $name"
              exit 1
            fi
          done

      - name: Authenticate to Microsoft 365
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Download private settings from SharePoint
        env:
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Download both files on every run; never print content or Graph errors.
          for filename in engineers.md priority_rules.md; do
            rm -f "$RUNNER_TEMP/$filename"
            if ! az rest --method GET \
              --url "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${FOLDER_ID}:/${filename}:/content" \
              --resource "https://graph.microsoft.com/" \
              --output-file "$RUNNER_TEMP/$filename" \
              --output none > "$RUNNER_TEMP/${filename}-download.log" 2>&1; then
              echo "::error::Could not download $filename from the report folder in SharePoint."
              exit 1
            fi
          done
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import engineer_matching
          import mail_analyzer
          import prioritization

          try:
              source = Path(os.environ['RUNNER_TEMP'])
              engineer_matching.load_profiles(source / 'engineers.md')
              prioritization.load_rules(source / 'priority_rules.md')
              config = mail_analyzer.load_config(Path('config.toml'), load_environment=False,
                                                 load_priority_rules=False)
              for filename, key in [('engineers.md', 'engineers_file'),
                                    ('priority_rules.md', 'priority_rules_file')]:
                  destination = Path(config['analysis'][key])
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source / filename, destination)
              mail_analyzer.load_config(Path('config.toml'), load_environment=False)
          except (OSError, ValueError, mail_analyzer.ToolError):
              raise SystemExit('engineers.md・priority_rules.mdの取得・UTF-8形式・見出しを確認してください。') from None
          PY

      - name: Analyze, persist progress, publish and notify
        env:
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
          SAKURA_MAIL_HOST: ${{ secrets.SAKURA_MAIL_HOST }}
          SAKURA_MAIL_USERNAME: ${{ secrets.SAKURA_MAIL_USERNAME }}
          SAKURA_MAIL_PASSWORD: ${{ secrets.SAKURA_MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        shell: bash
        run: |
          # Descriptor 3 streams fixed progress messages; detailed output stays private.
          if ! python sharepoint_run.py --progress-fd 3 --log-file "$RUNNER_TEMP/mail-analysis.log" 3>&1 > "$RUNNER_TEMP/mail-analysis.log" 2>&1; then
            echo "::error::Run failed. Resume with run ID ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}."
            exit 1
          fi
