name: SharePoint connection check

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Microsoft 365に認証
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: 保存先ライブラリの一覧を取得
        run: |
          az rest \
            --method GET \
            --url "https://graph.microsoft.com/v1.0/sites/tatsumielectronics.sharepoint.com,c9ff927a-a720-4d81-bb50-50f6bdac3be2,1786303b-fd84-4b83-a122-bdb481d41a21/drives" \
            --resource "https://graph.microsoft.com/" \
            --query 'value[].{name:name,id:id,webUrl:webUrl}' \
            --output json
