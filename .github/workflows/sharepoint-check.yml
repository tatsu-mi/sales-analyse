name: SharePoint connection check

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Microsoft 365に認証
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: SharePointにテストファイルを保存
        env:
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
        run: |
          printf 'SharePointへのアップロード接続確認です。\n' \
            > "$RUNNER_TEMP/sharepoint-check.txt"

          az rest \
            --method PUT \
            --url "https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${FOLDER_ID}:/sharepoint-check.txt:/content" \
            --resource "https://graph.microsoft.com/" \
            --headers "Content-Type=text/plain; charset=utf-8" \
            --body "@$RUNNER_TEMP/sharepoint-check.txt" \
            --query '{id:id,name:name,webUrl:webUrl}' \
            --output json
