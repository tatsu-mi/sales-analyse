name: Resume mail analysis

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Saved run ID (original GitHub run ID-attempt)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mail-report
  cancel-in-progress: false

jobs:
  resume:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Authenticate to Microsoft 365
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Restore and resume saved run
        env:
          RESUME_RUN_ID: ${{ inputs.run_id }}
          DRIVE_ID: ${{ vars.SHAREPOINT_DRIVE_ID }}
          FOLDER_ID: ${{ vars.SHAREPOINT_FOLDER_ID }}
          SAKURA_MAIL_HOST: ${{ secrets.SAKURA_MAIL_HOST }}
          SAKURA_MAIL_USERNAME: ${{ secrets.SAKURA_MAIL_USERNAME }}
          SAKURA_MAIL_PASSWORD: ${{ secrets.SAKURA_MAIL_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        shell: bash
        run: |
          # Descriptor 3 streams fixed progress messages; detailed output stays private.
          if ! python -m sales_analyze.sharepoint_run --resume "$RESUME_RUN_ID" --progress-fd 3 --log-file "$RUNNER_TEMP/mail-analysis.log" 3>&1 > "$RUNNER_TEMP/mail-analysis.log" 2>&1; then
            echo '::error::Resume failed. Check the saved run and service settings.'
            exit 1
          fi
